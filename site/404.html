*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--fg); font: 400 1.0625rem/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
body { min-height: 100svh; display: grid; place-items: center; padding: 32px 16px; overflow-x: clip; position: relative; isolation: isolate; }
body::before { content: ""; position: absolute; left: 50%; top: -20%; width: min(1100px, 120vw); aspect-ratio: 1; margin-left: calc(min(1100px, 120vw) / -2); background: radial-gradient(closest-side, rgba(255,159,10,.2), transparent); z-index: -1; }
main { width: min(680px, 100%); display: grid; gap: 22px; justify-items: start; }
.brand { display: flex; align-items: center; gap: 10px; color: var(--fg); font-weight: 700; text-decoration: none; }
.brand img { width: 30px; height: 30px; border-radius: 8px; }
h1 { margin: 0; font-size: clamp(2.5rem, 8vw, 5rem); line-height: 1; letter-spacing: -.04em; font-weight: 750; text-wrap: balance; }
h1 span { background: linear-gradient(100deg, #FFD27A, #FFB020 45%, #FF6A3D); -webkit-background-clip: text; background-clip: text; color: transparent; }
p { margin: 0; color: var(--fg-2); font-size: 1.1875rem; max-width: 32em; }
.runway { width: 100%; height: 16px; border-radius: 8px; background: rgba(255,255,255,.1); overflow: hidden; position: relative; }
.runway i { position: absolute; top: 0; bottom: 0; left: 0; width: 38%; background: var(--amber); }
.runway b { position: absolute; top: 0; bottom: 0; left: 38%; right: 0; background: repeating-linear-gradient(135deg, rgba(255,159,10,.55) 0 2px, transparent 2px 7px); }
.cap { font-size: .875rem; color: var(--amber-text); font-weight: 600; margin-top: -10px; }
.btn { display: inline-flex; align-items: center; min-height: 44px; padding: 0 24px; border-radius: 980px; background: var(--amber); color: var(--on-amber); font-weight: 650; text-decoration: none; }
.btn:hover { background: #FFC24D; }
