# Publishes the landing page (site/) to GitHub Pages. It lives on the `site` branch with launch/, so main stays
# the plugin alone (no images or video for installers to download). Turn it on once in Settings › Pages ›
# Source: GitHub Actions. Only the page and its images are published.
name: Landing page
on:
  push:
    branches: [site]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect the page and its images
        run: |
          mkdir _site
          cp site/index.html _site/
          cp -R site/img _site/img
          find _site -name '._*' -delete
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
