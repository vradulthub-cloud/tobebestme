# Builds a ToBeBestMe release from a version tag: runs the CI checks (ci.yml) first, so the provenance it
# signs vouches only for tested code, checks the committed manifest matches the files,
# publishes the zip with SHA256SUMS (every file in it but the two lists of hashes) and the zip's own
# SHA-256, and signs build provenance for the zip and SHA256SUMS. A tag whose commit is not on main is
# refused, so a release can only be built from reviewed history.
# Each action is pinned to a full commit SHA (its release tag in the comment), so a moved tag can't
# change what runs here.
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  release:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The tagged commit is on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_REF_NAME is not on main; releases are built only from commits on main."; exit 1; }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: The manifest matches the files and the tag matches the version
        run: |
          node tools/release-manifest.mjs
          git diff --exit-code .claude-plugin/integrity.json SHA256SUMS
          test "v$(node -p "require('./.claude-plugin/plugin.json').version")" = "$GITHUB_REF_NAME"
      - name: Package
        run: zip -r "tobebestme-${GITHUB_REF_NAME}.zip" .claude-plugin/plugin.json .claude-plugin/marketplace.json .claude-plugin/integrity.json hooks types LICENSE TRADEMARKS.md README.md SECURITY.md SHA256SUMS -x '*/._*'
      - name: The zip's own SHA-256
        run: sha256sum "tobebestme-${GITHUB_REF_NAME}.zip" > "tobebestme-${GITHUB_REF_NAME}.zip.sha256"
      # GitHub signs provenance for public repositories (and private ones on Enterprise Cloud only), so
      # a private repository's release ships SHA256SUMS without it
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: github.event.repository.visibility == 'public'
        with:
          subject-path: |
            tobebestme-*.zip
            SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "ToBeBestMe ${GITHUB_REF_NAME#v}" --notes "See CHANGELOG.md. Verify the download with its .sha256 file and gh attestation verify, and the files inside with SHA256SUMS (SECURITY.md)." "tobebestme-${GITHUB_REF_NAME}.zip" "tobebestme-${GITHUB_REF_NAME}.zip.sha256" SHA256SUMS
