# Keeps the pinned action SHAs and the end-to-end test tooling current. Dependabot rewrites a pin to the new
# commit SHA and its release tag in the comment; CI runs on each pull request it opens.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: weekly
